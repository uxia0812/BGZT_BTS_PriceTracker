name: Update BTS Photocard Data

on:
  schedule:
    # 매일 오전 3시 (KST 기준 12시, UTC 기준 3시)에 실행
    - cron: '0 3 * * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest data from Redash
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_API_KEY }}
          REDASH_QUERY_ID: ${{ secrets.REDASH_QUERY_ID }}
          REDASH_BASE_URL: ${{ secrets.REDASH_BASE_URL }}
        run: |
          python fetch_redash_data.py

      - name: Generate HTML (Korean + English)
        run: |
          python bts_photocard_analyzer.py --skip-validate --all-locales

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet bts_photocard_data.json bts_photocard_market.html en/bts_photocard_market.html || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bts_photocard_data.json bts_photocard_market.html en/bts_photocard_market.html
          git commit -m "🤖 Auto-update: BTS photocard data ($(date +'%Y-%m-%d %H:%M:%S'))"
          git push

      - name: Deployment notification
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "✅ Data updated successfully!"
          echo "📊 Vercel will automatically deploy the changes"
